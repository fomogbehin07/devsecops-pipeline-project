name: DevSecOps Pipeline

on: [push]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      # Step 1: You must pull your code into the runner
      - name: Checkout code
        uses: actions/checkout@v4

        checkov-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: all # Scans IaC, SCA, and Secrets
          soft_fail: false # Fails the build if issues are found
          output_format: cli
          # api-key: ${{ secrets.BC_API_KEY }} # Required for full SCA results
